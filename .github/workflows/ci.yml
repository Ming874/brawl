name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (syntax + server smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18          # what the Mac's railpack build uses (engines: >=18)
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check (server + browser modules)
        run: |
          node --check server.js
          tmp=$(mktemp -d)
          find public/js -name '*.js' | while read -r f; do
            cp "$f" "$tmp/check.mjs"
            node --check "$tmp/check.mjs" || { echo "::error file=$f::syntax error"; exit 1; }
          done
      - name: Smoke test (start server, HTTP + WebSocket)
        run: |
          PORT=38080 node server.js > server.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:38080/health >/dev/null 2>&1 && break; sleep 0.5; done
          kill -0 "$SERVER" || { echo "::error::server.js exited during startup"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:38080/health
          curl -fsS -o /dev/null http://127.0.0.1:38080/
          curl -fsS -o /dev/null http://127.0.0.1:38080/js/main.js
          curl -fsS -o /dev/null http://127.0.0.1:38080/vendor/three/build/three.module.js
          node -e '
            const WebSocket = require("ws");
            const ws = new WebSocket("ws://127.0.0.1:38080/ws");
            const timer = setTimeout(() => { console.error("no welcome reply within 5 s"); process.exit(1); }, 5000);
            ws.on("open", () => ws.send(JSON.stringify({ t: "hello", name: "ci" })));
            ws.on("message", (d) => { const m = JSON.parse(d); if (m.t === "welcome") { console.log("WebSocket welcome, player code", m.code); clearTimeout(timer); ws.close(); process.exit(0); } });
            ws.on("error", (e) => { console.error(e.message); process.exit(1); });
          '
      - name: Server log
        if: always()
        run: cat server.log || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (changed commits)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then RANGE="$BASE..$GITHUB_SHA"; else RANGE="-1"; fi
          ./gitleaks git --redact --no-banner --log-opts="$RANGE" .

  promote:
    name: Promote to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: promote-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward production
        run: |
          if git rev-parse -q --verify origin/production >/dev/null; then
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/production; then echo "production already contains $GITHUB_SHA"; exit 0; fi
            git merge-base --is-ancestor origin/production "$GITHUB_SHA" || { echo "::error::production has commits that are not on main; promote by hand"; exit 1; }
          fi
          git push origin "$GITHUB_SHA:refs/heads/production"
          echo "Promoted \`${GITHUB_SHA::7}\` to production" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify failure
    if: failure() && github.event_name == 'push'
    needs: [verify, secrets, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MSG: ${{ github.event.head_commit.message }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "DISCORD_WEBHOOK_URL not set; skipping"; exit 0; }
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "${GITHUB_SHA::7}" --arg msg "$(printf '%s' "$MSG" | head -n1 | cut -c1-200)" \
                --arg actor "$GITHUB_ACTOR" --arg url "$URL" \
            '{username: "mac-server-watchdog", allowed_mentions: {parse: []}, embeds: [{
               title: ("CI FAILED · " + $repo), url: $url, color: 15844367,
               description: ("**Not deployed** — this commit was not promoted to production.\n`" + $sha + "` " + $msg),
               fields: [{name: "Author", value: $actor, inline: true}, {name: "Logs", value: ("[Open run](" + $url + ")"), inline: true}],
               footer: {text: "GitHub Actions · CI gate"}, timestamp: (now | todate)}]}' \
          | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
